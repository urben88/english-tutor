[project]
name = "english-tutor"
version = "0.1.0"
description = "Local English conversation tutor with swappable STT / LLM / TTS adapters"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "onnxruntime>=1.18",
    "pywhispercpp>=1.3",
    "langgraph>=1.2.18",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs a real local model file or service"]

