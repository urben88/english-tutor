# One adapter per port, chosen by name. Params are passed to the adapter constructor.
stt:
  adapter: whisper_server        # GPU: connects to a running whisper-server (see README)
  params:
    host: 127.0.0.1
    port: 8178
    language: en
  # CPU fallback: replace the block above with
  #   adapter: whisper_cpp
  #   params:
  #     model_path: 'C:\Users\tirol\AppData\Roaming\com.pais.handy\models\ggml-large-v3-turbo-q8_0.bin'
  #     language: en
  #     n_threads: 4

llm:
  adapter: ollama
  params:
    model: "MobiusDevelopment/gemma-4-E2B-it-qat-q4_0-gguf:latest"
    base_url: http://localhost:11434
    # Shared with other tools: if this model is already loaded in Ollama, its context window is
    # used instead of num_ctx (so Ollama never reloads it) and its lifetime is never shortened.
    # num_ctx and keep_alive only apply when the model is not loaded yet.
    num_ctx: 4096
    # keep_alive: 30m           # optional; omit to use Ollama's default
    temperature: 0.7
    num_predict: 256
    think: false

tts:
  adapter: supertonic
  params:
    model_dir: 'C:\Users\tirol\AppData\Local\asistente-voz-local\lector\modelo\supertonic'
    voice: M1
    steps: 8

# Persona: stem of a file in personas/ (name, voice, system_prompt). Defaults to emma.
persona: emma

# Conversation history. The DB path is git-ignored. Optional: defaults to sqlite at data/history.db.
store:
  adapter: sqlite
  params:
    path: data/history.db

# Tokens kept free on top of llm num_predict: prompt budget = effective num_ctx - num_predict - margin.
context_margin: 256

# Terminal voice loop (python -m backend.cli).
cli:
  hold_key: ctrl_r          # pynput Key name (ctrl_r, f9, ...) or one character
  min_press_seconds: 0.3    # shorter presses are ignored
